services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bagula-open-kitchen:latest
    container_name: bagula-web
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
